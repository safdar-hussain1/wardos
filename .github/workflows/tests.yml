name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc -b && npx tsc -p tsconfig.bench.json

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed site matches a fresh build
        run: git diff --exit-code -- docs/ && test -z "$(git status --porcelain -- docs/)"
